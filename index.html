<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Outfit Matcher</title>
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Outfit">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="masthead">
    <div>
      <p class="eyebrow">The daily edit</p>
      <h1>Outfit Matcher</h1>
    </div>
    <button id="reset" class="text-btn">Reset</button>
  </header>

  <main>
    <section class="look">
      <svg class="look-art" viewBox="0 0 120 160" aria-label="Outfit preview">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" class="hatch-line"/>
          </pattern>
        </defs>
        <rect data-piece="jacket" class="block blk-jacket" x="0" y="0" width="120" height="92"/>
        <rect data-piece="shirt" class="block blk-shirt" x="0" y="0" width="120" height="92"/>
        <rect data-piece="pants" class="block blk-pants" x="0" y="96" width="120" height="64"/>
      </svg>
      <ol id="pieces" class="pieces"></ol>
    </section>

    <section id="panel" class="panel"></section>
  </main>

  <script src="colors.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
